<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Калькулятор риск-менеджмента для трейдера</title>
    <meta
      name="description"
      content="Рассчитайте риск, размер позиции, Stop Loss, Take Profit и Risk/Reward для сделки. Инструмент для дисциплинированного риск-менеджмента."
    >
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#090907">
    <link rel="canonical" href="https://risk-calculator-one.vercel.app/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://risk-calculator-one.vercel.app/">
    <meta property="og:title" content="Калькулятор риск-менеджмента для трейдера">
    <meta
      property="og:description"
      content="Рассчитайте риск, размер позиции, Stop Loss, Take Profit и Risk/Reward перед сделкой."
    >
    <meta property="og:site_name" content="Risk Calculator">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:image" content="https://risk-calculator-one.vercel.app/risk-calculator-screenshot.png">
    <meta property="og:image:alt" content="Интерфейс калькулятора риск-менеджмента">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Калькулятор риск-менеджмента для трейдера">
    <meta
      name="twitter:description"
      content="Рассчитайте риск, размер позиции, Stop Loss, Take Profit и Risk/Reward перед сделкой."
    >
    <meta name="twitter:image" content="https://risk-calculator-one.vercel.app/risk-calculator-screenshot.png">
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="brand-bar">
          <div class="brand-mark" data-brand-mark aria-hidden="true"></div>
          <img class="brand-logo" data-brand-logo alt="" hidden>
          <div>
            <p class="brand-name" data-brand-name></p>
            <p class="brand-short" data-brand-short></p>
          </div>
        </div>
        <p class="eyebrow">Дисциплина и расчёт</p>
        <h1>Калькулятор риск-менеджмента входа в сделку</h1>
        <p class="hero-description" data-brand-description></p>
        <p class="hero-copy" data-brand-tagline></p>
        <div class="hero-actions">
          <a class="telegram-link" data-telegram-link target="_blank" rel="noopener noreferrer"></a>
          <button class="ghost-button" type="button" data-education-toggle aria-expanded="false"></button>
        </div>
        <nav class="social-links" data-social-links aria-label="Социальные ссылки"></nav>
      </header>

      <form class="panel form-card" data-form>
        <div class="field">
          <label for="deposit">Ваш депозит</label>
          <div class="input-shell">
            <input id="deposit" type="number" min="0.00000001" step="any" value="1000" required>
            <span>$</span>
          </div>
        </div>

        <section class="risk-control" aria-labelledby="risk-title">
          <div class="field-head">
            <label id="risk-title" for="riskPercent">Риск на сделку</label>
            <strong data-risk-value>1%</strong>
          </div>
          <input id="riskPercent" class="range" type="range" min="0.5" max="5" step="0.5" value="1">
          <div class="preset-row" aria-label="Быстрый выбор риска">
            <button type="button" data-risk-preset="0.5">0.5%</button>
            <button type="button" data-risk-preset="1">1%</button>
            <button type="button" data-risk-preset="2">2%</button>
            <button type="button" data-risk-preset="3">3%</button>
            <button type="button" data-risk-preset="5">5%</button>
          </div>
        </section>

        <section class="direction-group" aria-label="Направление сделки">
          <input id="direction" type="hidden" value="long">
          <button type="button" data-direction="long">LONG</button>
          <button type="button" data-direction="short">SHORT</button>
        </section>

        <div class="grid">
          <div class="field">
            <label for="entryPrice">Цена входа</label>
            <input id="entryPrice" type="number" min="0.00000001" step="any" value="100" required>
          </div>
          <div class="field">
            <div class="field-head">
              <label for="stopLossPrice">Stop Loss</label>
              <span data-stop-delta></span>
            </div>
            <input id="stopLossPrice" type="number" min="0.00000001" step="any" value="98" required>
          </div>
          <div class="field wide">
            <div class="field-head">
              <label for="takeProfitPrice">Take Profit</label>
              <span data-take-profit-delta></span>
            </div>
            <input id="takeProfitPrice" type="number" min="0.00000001" step="any" value="106" required>
          </div>
        </div>

        <div class="form-actions">
          <button class="result-link" type="submit">Результаты расчёта ниже</button>
          <button class="ghost-button" type="button" data-reset-button>Сбросить значения</button>
        </div>
      </form>

      <section class="panel education-card" data-education-panel hidden>
        <div class="section-title">
          <p class="eyebrow">База риска</p>
          <h2>Обучение и правила риска</h2>
        </div>
        <div class="education-grid" data-education-list></div>
        <p class="disclaimer" data-disclaimer></p>
      </section>

      <section class="panel results-card" aria-live="polite">
        <div class="section-title">
          <p class="eyebrow">Итог</p>
          <h2>Результаты расчёта</h2>
        </div>
        <p class="error" data-error></p>
        <div class="rr-quality" data-rr-quality hidden></div>
        <div class="metrics" data-result></div>
        <div class="result-actions">
          <button class="ghost-button" type="button" data-copy-plan-button>Скопировать план сделки</button>
          <button class="ghost-button" type="button" data-share-button>Поделиться калькулятором</button>
          <span class="share-status" data-copy-plan-status aria-live="polite"></span>
          <span class="share-status" data-share-status aria-live="polite"></span>
        </div>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
